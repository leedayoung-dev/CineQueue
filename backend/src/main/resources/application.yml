
spring:
  application:
    name: cinequeue-backend

  # MySQL
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:cinequeue}?sslMode=${DB_SSL_MODE:REQUIRED}
    username: ${DB_USERNAME:cinequeue}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # JPA
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  # Redis
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

# JWT
jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000 # 60분(ms)

# 예매 관련 시간 설정
reservation:
  seat-hold-seconds: 180
  waiting-user-reservation-seconds: 180

# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health

# 영화관 상영 시간표
cinema:
  schedule:
    base-url: https://mcp.aka.page

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}

# TMDB
tmdb:
  api:
    base-url: https://api.themoviedb.org/3
    read-access-token: ${TMDB_API_READ_ACCESS_TOKEN}